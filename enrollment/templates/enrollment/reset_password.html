{% extends 'enrollment/base.html' %}

{% block title %}Reset Password - DLL Enrollment System{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card glass-card-form border-0 p-4 p-md-5 shadow-lg rounded-4 text-white">
            
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-20 d-inline-flex p-3 rounded-circle text-primary mb-2 shadow-sm">
                    <i class="fa-solid fa-shield-halved fs-2 text-info"></i>
                </div>
                <h3 class="fw-bold text-white mt-2">Reset Password</h3>
                <p class="text-light opacity-75 small mb-0 fw-semibold">Enter your account email address to receive a secure password reset link.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="id_email" class="form-label text-light opacity-75 fw-bold small">Email Address</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" id="id_email" class="form-control rounded-end-3 border-secondary text-white" placeholder="Enter your registered email" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-gradient-primary w-100 py-2 rounded-pill fw-bold shadow-sm border-0">
                    <i class="fa-solid fa-paper-plane me-1"></i> Send Reset Link
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <a href="{% url 'enrollment:login' %}" class="text-info text-decoration-none fw-bold small">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
