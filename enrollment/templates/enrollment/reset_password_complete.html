{% extends 'enrollment/base.html' %}

{% block title %}Password Reset Complete - DLL Enrollment System{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        
        <div class="card glass-card-form border-0 p-4 p-md-5 shadow-lg rounded-4 text-center text-white">
            
            <div class="mb-3">
                <i class="fa-solid fa-circle-check fs-1 text-success mb-2"></i>
                <h3 class="fw-bold text-white mt-2">Password Reset Complete</h3>
            </div>
            
            <p class="text-light opacity-75 small mt-2 mb-4 fw-semibold">Your password has been updated. You can now sign in with your new credentials.</p>
            
            <div>
                <a href="{% url 'enrollment:login' %}" class="btn btn-primary btn-gradient-primary rounded-pill fw-bold px-4 py-2 shadow-sm border-0">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In Now
                </a>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
